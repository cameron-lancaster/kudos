<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kudos</title>
<meta name="description" content="A friendly tally of favors between friends.">
<link rel="icon" href="icon.png">
<style>
  :root { --ink: #1d1a18; --muted: #6b625c; --accent: #e8561c; --bg: #fdf7f0; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f4eee9; --muted: #b3a79e; --accent: #ff8a4c; --bg: #171311; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 48px 16px; max-width: 520px; }
  img { width: 128px; height: 128px; border-radius: 29px; box-shadow: 0 12px 32px rgba(232, 86, 28, 0.3); }
  h1 { font-size: 44px; margin: 20px 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Kudos app icon">
  <h1>Kudos</h1>
  <p>A friendly tally of favors between friends. Someone gives you a ride? Send them a Kudos.</p>
  <a href="privacy.html">Privacy Policy</a>
</main>
</body>
</html>
